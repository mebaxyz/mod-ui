version: '3.8'

services:
  mod-ui:
    build:
      context: .
      dockerfile: services/mod-ui-service/Dockerfile
    ports:
      - "8080:8080"
    volumes:
      - ./html:/app/html
    environment:
      - MOD_HTML_DIR=/app/html

  mod-api:
    build:
      context: .
      dockerfile: services/mod-api/Dockerfile
    ports:
      - "8888:8888"
    volumes:
      - ./data:/app/data
      - ./mod:/app/mod
      - ./html:/app/html
    depends_on:
      - mod-ui
    environment:
      - MOD_HTML_DIR=/app/html
      - MOD_DATA_DIR=/app/data

  # Add more services as needed