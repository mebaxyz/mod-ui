[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "servicebus"
version = "0.1.0"
description = "A flexible, high-performance service communication library built on Redis pub/sub"
readme = "README.md"
requires-python = ">=3.8"
authors = [
    { name = "MOD-UI Project" }
]
keywords = ["microservices", "redis", "pubsub", "service-discovery", "async"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers", 
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9", 
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Distributed Computing",
]

dependencies = [
    "redis[hiredis]>=5.0.0",
    "pydantic>=2.0.0",
    "typing-extensions>=4.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "mypy>=1.0.0",
    "ruff>=0.1.0",
]

[project.urls]
Homepage = "https://github.com/moddevices/mod-ui"
Repository = "https://github.com/moddevices/mod-ui"
Documentation = "https://github.com/moddevices/mod-ui/tree/main/microservice_comm"
Issues = "https://github.com/moddevices/mod-ui/issues"

[tool.hatch.build.targets.wheel]
packages = ["microservice_comm"]

[tool.black]
line-length = 88
target-version = ['py38']

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true

[tool.ruff]
line-length = 88
target-version = "py38"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
asyncio_mode = "auto"