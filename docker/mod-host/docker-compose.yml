version: '3.8'
services:
  mod-host:
    build:
      context: ../../
      dockerfile: docker/mod-host/Dockerfile
    image: mod-host:local
    container_name: mod-host-local
    # If you need JACK access to host audio, uncomment the device line
    # devices:
    #   - /dev/snd:/dev/snd
    ports:
      - "5555:5555"
      - "5556:5556"
    environment:
      - "JACK_NO_AUDIO_RESERVATION=1"
    tty: true
    stdin_open: true
    restart: unless-stopped
