# Docker compose development environment for MOD UI - Modular FastAPI Architecture

services:
  mod-api:
    build:
      context: ..
      dockerfile: docker/api/Dockerfile
    container_name: mod-ui-api
    restart: unless-stopped
    ports:
      - "8888:8888"
    volumes:
      - ../src:/app/src
      - ../mod:/app/mod
      - ../modtools:/app/modtools
      - ../utils:/app/utils
      - ../html:/app/html
      - ../default.pedalboard:/app/default.pedalboard
      - mod-data:/app/data
      - /tmp/.X11-unix:/tmp/.X11-unix:ro
    environment:
      - MOD_DEBUG=1
      - MOD_PORT=8888
      - MOD_HOST=0.0.0.0
      - MOD_DATA_DIR=/app/data
      - MOD_HTML_DIR=/app/html
      - MOD_LOG=1
      - PYTHONPATH=/app
      - LD_LIBRARY_PATH=/app/utils:/app/modtools
    devices:
      - /dev/snd:/dev/snd
    privileged: true
    depends_on:
      - mod-session-v2  # Modern FastAPI-based session service
    networks:
      - mod-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8888/ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  mod-web:
    build:
      context: ..
      dockerfile: docker/web/Dockerfile
    container_name: mod-ui-web
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ../html:/usr/share/nginx/html:ro
    depends_on:
      - mod-api
    networks:
      - mod-network

  mod-session-v2:
    build:
      context: ..
      dockerfile: docker/session_v2/Dockerfile
    container_name: mod-ui-session-v2
    restart: unless-stopped
    ports:
      - "8002:8002"  # Session service v2 port
    volumes:
      - ../src:/app/src
      - ../mod:/app/mod
      - ../modtools:/app/modtools
      - mod-data:/app/data
    environment:
      - MOD_DEV_ENVIRONMENT=1
      - MOD_LOG=1
      - SESSION_SERVICE_HOST=0.0.0.0
      - SESSION_SERVICE_PORT=8002
      - EVENT_BUS_TYPE=inmemory
      - PYTHONPATH=/app/src:/app
    networks:
      - mod-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  mod-hardware:
    build:
      context: ..
      dockerfile: docker/hardware/Dockerfile
    container_name: mod-ui-hardware
    restart: unless-stopped
    volumes:
      - ../mod:/app/mod
      - /dev:/dev
      - mod-data:/data
    privileged: true  # Required for hardware access
    environment:
      - MOD_DEV=1
      - MOD_LOG_LEVEL=DEBUG
      - MOD_DATA_DIR=/data
    networks:
      - mod-network

volumes:
  mod-data:
    driver: local

networks:
  mod-network:
    driver: bridge