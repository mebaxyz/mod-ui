# Docker compose development environment for MOD UI - Modular FastAPI Architecture

services:
  mod-api:
    build:
      context: ..
      dockerfile: docker/api/Dockerfile
    container_name: mod-ui-api
    restart: unless-stopped
    ports:
      - "8888:8888"
    volumes:
      - ../src:/app/src
      - ../mod:/app/mod
      - ../modtools:/app/modtools
      - ../utils:/app/utils
      - ../html:/app/html
      - ../default.pedalboard:/app/default.pedalboard
      - mod-data:/app/data
      - /tmp/.X11-unix:/tmp/.X11-unix:ro
    environment:
      - MOD_DEBUG=1
      - MOD_PORT=8888
      - MOD_HOST=0.0.0.0
      - MOD_DATA_DIR=/app/data
      - MOD_HTML_DIR=/app/html
      - MOD_LOG=1
      - PYTHONPATH=/app
      - LD_LIBRARY_PATH=/app/utils:/app/modtools
    devices:
      - /dev/snd:/dev/snd
    privileged: true
    depends_on:
      - mod-session-v2  # Modern FastAPI-based session service
    networks:
      - mod-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8888/ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  mod-web:
    build:
      context: ..
      dockerfile: docker/web/Dockerfile
    container_name: mod-ui-web
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ../html:/usr/share/nginx/html:ro
    depends_on:
      - mod-api
    networks:
      - mod-network

  mod-session-v2:
    build:
      context: ..
      dockerfile: docker/session_v2/Dockerfile
    container_name: mod-ui-session-v2
    restart: unless-stopped
    ports:
      - "8002:8002"  # Session service v2 port
    volumes:
      - ../src:/app/src
      - ../mod:/app/mod
      - ../modtools:/app/modtools
      - mod-data:/app/data
    environment:
      - MOD_DEV_ENVIRONMENT=1
      - MOD_LOG=1
      - SESSION_SERVICE_HOST=0.0.0.0
      - SESSION_SERVICE_PORT=8002
      - EVENT_BUS_TYPE=redis
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_DB=0
      - PYTHONPATH=/app/src:/app
    depends_on:
      - redis
    networks:
      - mod-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  mod-hardware:
    build:
      context: ..
      dockerfile: docker/hardware/Dockerfile
    container_name: mod-ui-hardware
    restart: unless-stopped
    ports:
      - "8003:8003"  # Hardware service standalone port
    volumes:
      - ../src:/app/src
      - ../mod:/app/mod
      - /dev:/dev
      - mod-data:/data
    privileged: true  # Required for hardware access
    environment:
      - MOD_DEV=1
      - MOD_LOG_LEVEL=DEBUG
      - MOD_DATA_DIR=/data
      - HARDWARE_SERVICE_HOST=0.0.0.0
      - HARDWARE_SERVICE_PORT=8003
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_DB=0
      - PYTHONPATH=/app/src:/app
    depends_on:
      - redis
    networks:
      - mod-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8003/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  mod-system-stats:
    build:
      context: ..
      dockerfile: docker/system_stats/Dockerfile
    container_name: mod-ui-system-stats
    restart: unless-stopped
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
    privileged: true  # Required for system stats access
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_DB=0
      - STATS_BROADCAST_INTERVAL=5.0
      - PYTHONPATH=/app
    depends_on:
      - redis
    networks:
      - mod-network
    healthcheck:
      test: ["CMD", "python", "-c", "import redis; redis.Redis(host='redis').ping()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  mod-websocket-gateway:
    build:
      context: ..
      dockerfile: docker/websocket_gateway/Dockerfile
    container_name: mod-ui-websocket-gateway
    restart: unless-stopped
    ports:
      - "8081:8081"  # WebSocket Gateway service port
    volumes:
      - ../src:/app/src
    environment:
      - DEBUG=true
      - WEBSOCKET_GATEWAY_HOST=0.0.0.0
      - WEBSOCKET_GATEWAY_PORT=8081
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_DB=0
      - REDIS_CHANNEL_PREFIX=mod_ui
      - MAX_CONNECTIONS=100
      - WEBSOCKET_TIMEOUT=300
      - MESSAGE_QUEUE_SIZE=1000
      - LOG_LEVEL=INFO
      - PYTHONPATH=/app/src:/app
    depends_on:
      - redis
    networks:
      - mod-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: mod-ui-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - mod-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  mod-data:
    driver: local
  redis-data:
    driver: local

networks:
  mod-network:
    driver: bridge