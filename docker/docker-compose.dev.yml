# Docker compose development environment for MOD UI - Modular FastAPI Architecture

services:

  mod-web:
    build:
      context: ..
      dockerfile: docker/web/Dockerfile
    container_name: mod-ui-web
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ../src/mod_ui/static:/usr/share/nginx/html:ro
    networks:
      - mod-network

  mod-session-v2:
    build:
      context: ..
      dockerfile: docker/session_v2/Dockerfile
    container_name: mod-ui-session-v2
    restart: unless-stopped
    volumes:
      - ../src:/app/src
      - ../src/mod_ui_original:/app/mod  # Original code archive
      - ../src/mod_ui/utils/modtools:/app/modtools  # Copied utilities
      - ../config:/app/config  # Configuration files
      - mod-data:/app/data
    environment:
      - MOD_DEV_ENVIRONMENT=1
      - MOD_LOG=1
      - EVENT_BUS_TYPE=redis
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_DB=0
      - PYTHONPATH=/app/src:/app
    depends_on:
      - redis
      - mod-audio-engine
    networks:
      - mod-network
    healthcheck:
      test: ["CMD", "python", "-c", "import redis, os; redis.Redis(host=os.getenv('REDIS_HOST', 'redis')).ping()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  mod-hardware:
    build:
      context: ..
      dockerfile: docker/hardware/Dockerfile
    container_name: mod-ui-hardware
    restart: unless-stopped
    ports:
      - "8003:8003"  # Hardware service standalone port
    volumes:
      - ../src:/app/src
      - ../src/mod_ui_original:/app/mod  # Original code archive
      - ../config:/app/config  # Configuration files
      - /dev:/dev
      - mod-data:/data
    privileged: true  # Required for hardware access
    environment:
      - MOD_DEV=1
      - MOD_LOG_LEVEL=DEBUG
      - MOD_DATA_DIR=/data
      - HARDWARE_SERVICE_HOST=0.0.0.0
      - HARDWARE_SERVICE_PORT=8003
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_DB=0
      - PYTHONPATH=/app/src:/app
    depends_on:
      - redis
    networks:
      - mod-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8003/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  mod-system-stats:
    build:
      context: ..
      dockerfile: docker/system_stats/Dockerfile
    container_name: mod-ui-system-stats
    restart: unless-stopped
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
    privileged: true  # Required for system stats access
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_DB=0
      - STATS_BROADCAST_INTERVAL=5.0
      - PYTHONPATH=/app
    depends_on:
      - redis
    networks:
      - mod-network
    healthcheck:
      test: ["CMD", "python", "-c", "import redis; redis.Redis(host='redis').ping()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  mod-webui-gateway:
    build:
      context: ..
      dockerfile: docker/webui_gateway/Dockerfile
    container_name: mod-ui-webui-gateway
    restart: unless-stopped
    ports:
      - "8081:8081"  # WebSocket Gateway service port
    volumes:
      - ../src:/app/src
    environment:
      - DEBUG=true
      - WEBSOCKET_GATEWAY_HOST=0.0.0.0
      - WEBSOCKET_GATEWAY_PORT=8081
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_DB=0
      - REDIS_CHANNEL_PREFIX=mod_ui
      - MAX_CONNECTIONS=100
      - WEBSOCKET_TIMEOUT=300
      - MESSAGE_QUEUE_SIZE=1000
      - LOG_LEVEL=INFO
      - PYTHONPATH=/app/src:/app
    depends_on:
      - redis
    networks:
      - mod-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  mod-effects-service:
    build:
      context: ..
      dockerfile: docker/effects_service/Dockerfile
    container_name: mod-ui-effects-service
    restart: unless-stopped
    # No HTTP port needed for Redis pub/sub service
    volumes:
      # Remove src volume mount to avoid Redis import issues
      # - ../src:/app/src
      - ../src/mod_ui_original:/app/mod  # Original code archive
      - ../src/mod_ui/utils/modtools:/app/modtools  # Copied utilities
      - ../utils:/app/utils
      - ../config:/app/config  # Configuration files
      - mod-data:/app/data
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_DB=0
      - LOG_LEVEL=INFO
      - PYTHONPATH=/app/src:/app
      - LD_LIBRARY_PATH=/app/utils:/app/modtools
    depends_on:
      - redis
    networks:
      - mod-network
    healthcheck:
      test: ["CMD", "python", "-c", "import redis; redis.Redis(host='redis').ping()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  mod-config-service:
    build:
      context: ..
      dockerfile: docker/config_service/Dockerfile
    container_name: mod-ui-config-service
    restart: unless-stopped
    # No HTTP port needed for Redis pub/sub service
    volumes:
      # Remove src volume mount to avoid Redis import issues
      - ../src:/app/src
      - ../config:/app/config  # Configuration files
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_DB=0
      - LOG_LEVEL=INFO
      - PYTHONPATH=/app/src:/app
    depends_on:
      - redis
    networks:
      - mod-network
    healthcheck:
      test: ["CMD", "python", "-c", "import redis; redis.Redis(host='redis').ping()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  mod-audio-engine:
    build:
      context: ..
      dockerfile: docker/audio_engine/Dockerfile
    container_name: mod-ui-audio-engine
    restart: unless-stopped
    # No HTTP port needed for ServiceBus communication
    volumes:
      - ../src:/app/src
      - ../libraries:/app/libraries
      - ../utils:/app/utils  # Required for libmod_utils.so
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_DB=0
      - MOD_HOST_HOST=mod-host  # mod-host service name
      - MOD_HOST_WRITE_PORT=5555
      - MOD_HOST_READ_PORT=5556
      - LOG_LEVEL=INFO
      - PYTHONPATH=/app/src:/app
    depends_on:
      - redis
    networks:
      - mod-network
    healthcheck:
      test: ["CMD", "python", "-c", "import redis; redis.Redis(host='redis').ping()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  redis:
    image: redis:7-alpine
    container_name: mod-ui-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - mod-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  mod-data:
    driver: local
  redis-data:
    driver: local

networks:
  mod-network:
    driver: bridge