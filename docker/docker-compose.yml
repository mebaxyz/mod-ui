# Docker Compose configuration for MOD UI microservices
version: '3.8'

services:
  # API Service - FastAPI backend
  mod-api:
    build:
      context: ..
      dockerfile: docker/api/Dockerfile
    container_name: mod-ui-api
    ports:
      - "8888:8888"
    environment:
      - MOD_DEBUG=1
      - MOD_PORT=8888
      - MOD_HOST=0.0.0.0
      - MOD_DATA_DIR=/app/data
      - MOD_HTML_DIR=/app/html
      - MOD_LOG=1
    volumes:
      - ../data:/app/data
      - ../html:/app/html:ro
      - ../mod:/app/mod:ro
      - ../modtools:/app/modtools:ro
      - ../utils:/app/utils:ro
      - ../default.pedalboard:/app/default.pedalboard:ro
      - /tmp/.X11-unix:/tmp/.X11-unix:ro
    devices:
      - /dev/snd:/dev/snd
    privileged: true
    networks:
      - mod-network
    restart: unless-stopped
    depends_on:
      - mod-session

  # Web UI Service - Static file server
  mod-ui:
    build:
      context: ..
      dockerfile: docker/web/Dockerfile
    container_name: mod-ui-web
    ports:
      - "8080:80"
    volumes:
      - ../html:/usr/share/nginx/html:ro
      - ./web/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - mod-network
    restart: unless-stopped
    depends_on:
      - mod-api

  # Session Service - Core MOD UI logic (transition service)
  mod-session:
    build:
      context: ..
      dockerfile: docker/session/Dockerfile
    container_name: mod-ui-session
    environment:
      - MOD_DEBUG=1
      - MOD_DATA_DIR=/app/data
      - MOD_LOG=1
      - DEV_ENVIRONMENT=0
    volumes:
      - ../data:/app/data
      - ../utils:/app/utils:ro
      - /tmp/.X11-unix:/tmp/.X11-unix:ro
    devices:
      - /dev/snd:/dev/snd
      - /dev/ttyACM0:/dev/ttyACM0
    privileged: true
    networks:
      - mod-network
    restart: unless-stopped

networks:
  mod-network:
    driver: bridge

volumes:
  mod-data:
    driver: local